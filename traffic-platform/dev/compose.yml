name: traffic-platform-dev
services:
  mysql:
    image: mysql:8.0.32
    environment:
      MYSQL_ROOT_PASSWORD: Traffic_local_root_only_2026
      MYSQL_DATABASE: traffic_platform_it
      MYSQL_USER: traffic_app
      MYSQL_PASSWORD: Traffic_it_2026
    ports:
      - '127.0.0.1:23306:3306'
    volumes:
      - traffic_mysql:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:6.2
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:26379:6379'
    volumes:
      - traffic_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: traffic-platform-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: traffic_app
      RABBITMQ_DEFAULT_PASS: Traffic_mq_local_only_2026
    ports:
      - '127.0.0.1:25672:5672'
      - '127.0.0.1:25673:15672'
    volumes:
      - traffic_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_listener 5672']
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  traffic_mysql:
  traffic_redis:
  traffic_rabbitmq:
