name: traffic-platform-deploy
services:
  mysql:
    image: mysql:8.0.32
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run initialize.ps1}
      MYSQL_DATABASE: traffic_platform
      MYSQL_USER: traffic_app
      MYSQL_PASSWORD: ${TRAFFIC_DB_PASSWORD:?Run initialize.ps1}
    volumes:
      - deployment_mysql:/var/lib/mysql
      - ./.generated/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:6.2
    command: ['sh','-c','exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${TRAFFIC_REDIS_PASSWORD:?Run initialize.ps1}
    volumes: ['deployment_redis:/data']
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: traffic-deployment-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: traffic_app
      RABBITMQ_DEFAULT_PASS: ${TRAFFIC_RABBIT_PASSWORD:?Run initialize.ps1}
    volumes: ['deployment_rabbitmq:/var/lib/rabbitmq']
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_listener 5672']
      interval: 5s
      timeout: 5s
      retries: 30
  xxl-admin:
    image: ${XXL_IMAGE:-xuxueli/xxl-job-admin:3.4.2}
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: traffic_app
      SPRING_DATASOURCE_PASSWORD: ${TRAFFIC_DB_PASSWORD:?Run initialize.ps1}
      XXL_JOB_ACCESSTOKEN: ${TRAFFIC_JOB_ACCESS_TOKEN:?Run initialize.ps1}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
    depends_on:
      mysql: {condition: service_healthy}
    ports: ['127.0.0.1:29090:8080']
    volumes: ['deployment_job_logs:/data/applogs']
  app:
    image: traffic-platform:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        JAVA_IMAGE: ${JAVA_IMAGE:-eclipse-temurin:21-jre}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TRAFFIC_DB_URL: jdbc:mysql://mysql:3306/traffic_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true
      TRAFFIC_DB_USERNAME: traffic_app
      TRAFFIC_DB_PASSWORD: ${TRAFFIC_DB_PASSWORD:?Run initialize.ps1}
      TRAFFIC_REDIS_HOST: redis
      TRAFFIC_REDIS_PASSWORD: ${TRAFFIC_REDIS_PASSWORD:?Run initialize.ps1}
      TRAFFIC_RABBIT_HOST: rabbitmq
      TRAFFIC_RABBIT_USERNAME: traffic_app
      TRAFFIC_RABBIT_PASSWORD: ${TRAFFIC_RABBIT_PASSWORD:?Run initialize.ps1}
      TRAFFIC_JWT_SECRET: ${TRAFFIC_JWT_SECRET:?Run initialize.ps1}
      TRAFFIC_STORAGE_PROVIDER: shared-volume
      TRAFFIC_STORAGE_SHARED_ROOT: /data/evidence
      TRAFFIC_JOB_ADMIN_ADDRESSES: http://xxl-admin:8080
      TRAFFIC_JOB_ACCESS_TOKEN: ${TRAFFIC_JOB_ACCESS_TOKEN:?Run initialize.ps1}
      TRAFFIC_JOB_EXECUTOR_ADDRESS: http://app:29999/
      TRAFFIC_MODEL_URL: ${TRAFFIC_MODEL_URL:-http://host.docker.internal:5001/api/v1/detect}
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      xxl-admin: {condition: service_started}
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes: ['deployment_evidence:/data/evidence','deployment_executor_logs:/app/data/job-logs']
    healthcheck:
      test: ['CMD','curl','-fsS','http://127.0.0.1:8090/actuator/health/readiness']
      interval: 5s
      timeout: 10s
      start_period: 45s
      retries: 15
  nginx:
    image: ${NGINX_IMAGE:-nginx:stable-alpine}
    depends_on:
      app: {condition: service_healthy}
    ports: ['127.0.0.1:28090:80']
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    healthcheck:
      test: ['CMD','wget','-q','--spider','http://127.0.0.1/actuator/health/readiness']
      interval: 5s
      timeout: 10s
      retries: 10
volumes:
  deployment_mysql:
  deployment_redis:
  deployment_rabbitmq:
  deployment_evidence:
  deployment_job_logs:
  deployment_executor_logs:
